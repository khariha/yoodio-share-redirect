<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening Yoodio…</title>

    <style>
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            padding: 24px;
            text-align: center;
        }

        .btn {
            display: inline-block;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid #ddd;
            text-decoration: none;
            color: #000;
            font-weight: 600;
        }

        .btn:hover {
            background: #f6f6f6;
        }
    </style>
</head>

<body>
    <h1>Opening in Yoodio…</h1>
    <p>If nothing happens, tap the button below.</p>

    <a id="open" class="btn" href="#">Open Yoodio</a>

    <script>
        const params = new URLSearchParams(window.location.search);
        const stationId = params.get("stationId");

        // Deep link target
        const appUrl = stationId
            ? `yoodio://newStation?stationId=${encodeURIComponent(stationId)}`
            : `yoodio://newStation`;

        // Set fallback button
        document.getElementById("open").href = appUrl;

        // Attempt auto-open
        window.location.replace(appUrl);
    </script>
</body>
</html>
