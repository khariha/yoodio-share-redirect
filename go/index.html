<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening Yoodio…</title>

    <style>
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            padding: 24px;
        }

        .btn {
            display: inline-block;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #ddd;
            text-decoration: none;
            color: #000;
        }
    </style>
</head>

<body>
    <h1>Opening in Yoodio…</h1>
    <p>If you don’t have Yoodio installed, download it below.</p>

    <a id="open" class="btn" href="https://apps.apple.com/us/app/yoodio-generative-radio/id6743950965">
        Download Yoodio
    </a>

    <script>
        const params = new URLSearchParams(window.location.search);
        const stationId = params.get("stationId");

        // Deep link target
        const appUrl = stationId
            ? `yoodio://newStation?stationId=${encodeURIComponent(stationId)}`
            : `yoodio://newStation`;

        // Attempt auto-open
        window.location.replace(appUrl);
    </script>
</body>

</html>
